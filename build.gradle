buildscript {
    ext {
        vXnat = "1.10.1-SNAPSHOT"
    }
}

plugins {
    id "eclipse"
    id "idea"
    id "jacoco"
    id "java"
    id "maven-publish"
    id "com.dorongold.task-tree" version "1.5"
    id "com.palantir.git-version" version "3.0.0"
    id "io.franzbecker.gradle-lombok" version "5.0.0"
    id "io.spring.dependency-management" version "1.1.7"
    id "org.nrg.xnat.build.xnat-data-builder" version "${vXnat}"
}

group "org.nrg.xnatx"
version "1.1.1-SNAPSHOT"
description = "An implementation of the NIH stroke scale for XNAT."

repositories {
    mavenLocal()
    maven { url "https://nrgxnat.jfrog.io/nrgxnat/libs-release" }
    maven { url "https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot" }
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencyManagement.imports {
    mavenBom "org.nrg:parent:${vXnat}"
}

lombok {
    version = "1.18.34"
    sha256 = "1ea5ad6c6afcff902d75072b2aaa6695585aebee9f12127e15c0036ba95d2918"
}

dependencies {
    implementation("org.nrg.xnat:web") {
        transitive = false
    }
    // xnat-data-models merged into xnat-web in monorepo 1.10
    implementation "org.nrg.xdat:core"

    implementation "org.apache.commons:commons-lang3"
    implementation "org.slf4j:slf4j-api"
    implementation "log4j:log4j:1.2.17"

    // Compile-only deps that xnat-web no longer surfaces on consumer compileClasspath in monorepo 1.10.1+
    implementation("turbine:turbine") {
        exclude group: "commons-dbcp"
        exclude group: "commons-email"
        exclude group: "commons-pool"
        exclude group: "fulcrum"
        exclude group: "javax.activation", module: "activation"
        exclude group: "javax.mail"
        exclude group: "javax.servlet"
        exclude group: "jython"
        exclude group: "xalan"
        exclude group: "xml-apis"
        exclude group: "log4j", module: "log4j"
        exclude group: "berkeleydb"
        exclude group: "javax.sql"
        exclude group: "jndi"
        exclude group: "mysql"
        exclude group: "tomcat"
        exclude group: "xerces"
        exclude group: "velocity", module: "texen"
        exclude group: "jamon", module: "jamon"
    }
    compileOnly("org.apache.velocity:velocity") { transitive = false }
    compileOnly "javax.servlet:javax.servlet-api"

    testImplementation "junit:junit"
    testImplementation "org.springframework:spring-test"
}

jar {
    manifest {
        attributes "Application-Name": "XNAT NIH Stroke Scale Plugin",
                "Build-Date": new Date(),
                "Implementation-Sha": gitVersion(),
                "Implementation-Version": project.version
    }
}

compileJava {
    dependsOn xnatDataBuilder
    options.fork = false
}

configurations {
    all*.exclude group: "javax.sql", module: "jdbc-stdext"
    all*.exclude group: "javax.transaction", module: "jta"
    implementation.extendsFrom(implementAndInclude)
}

jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    reports {
        xml.required = false
        csv.required = false
        html.required = true
    }
}

sourceSets {
    main {
        java {
            srcDir "build/xnat-generated/src/main/java"
        }
        resources {
            srcDir "build/xnat-generated/src/main/resources"
        }
    }
}

// Pulls in the Jenkins BUILD_NUMBER environment variable if available.
def buildDate = new Date()
def buildNumber = System.getenv().BUILD_NUMBER?.toInteger() ?: "Manual"
def isDirty, branchName, gitHash, gitHashFull, commitDistance, lastTag, isCleanTag

try {
    def gitDetails = versionDetails()
    isDirty = gitVersion().endsWith ".dirty"
    branchName = gitDetails.branchName ?: "Unknown"
    gitHash = gitDetails.gitHash
    gitHashFull = gitDetails.gitHashFull
    commitDistance = gitDetails.commitDistance
    lastTag = gitDetails.lastTag
    isCleanTag = gitDetails.isCleanTag
} catch (IllegalArgumentException e) {
    logger.info "Got an error trying to read VCS metadata from git. It's possible this project is not under VCS control. Using placeholder values for manifest entries."
    isDirty = true
    branchName = "Unknown"
    gitHash = "None"
    gitHashFull = "None"
    commitDistance = 0
    lastTag = "None"
    isCleanTag = false
}

ext.gitManifestAttrs = [
        "Application-Name"        : project.description,
        "Build-Date"              : buildDate,
        "Build-Number"            : buildNumber,
        "Implementation-Version"  : project.version,
        "Implementation-Sha"      : gitHash,
        "Implementation-Sha-Full" : gitHashFull,
        "Implementation-Commit"   : commitDistance,
        "Implementation-LastTag"  : lastTag,
        "Implementation-Branch"   : branchName,
        "Implementation-CleanTag" : isCleanTag,
        "Implementation-Dirty"    : isDirty
]

logger.info """
Building artifacts with manifest attributes:

 * Build-Date:              ${buildDate}
 * Build-Number:            ${buildNumber}
 * Implementation-Version:  ${version}
 * Implementation-Sha-Full: ${gitHashFull}
 * Implementation-Sha:      ${gitHash}
 * Implementation-Commit:   ${commitDistance}
 * Implementation-LastTag:  ${lastTag}
 * Implementation-Branch:   ${branchName}
 * Implementation-CleanTag: ${isCleanTag}
 * Implementation-Dirty:    ${isDirty}
"""

task sourceJar(type: Jar, dependsOn: classes) {
    archiveClassifier.set("sources")
    manifest {
        attributes gitManifestAttrs
    }
    from sourceSets.main.allSource
}

task javadocJar(type: Jar) {
    archiveClassifier.set("javadoc")
    manifest {
        attributes gitManifestAttrs
    }
    from javadoc.destinationDir
}

jar {
    dependsOn test, sourceJar, javadocJar
    enabled = true
    manifest {
        attributes gitManifestAttrs
    }
}

task xnatPluginJar(type: Jar) {
    dependsOn test, sourceJar, javadocJar
    zip64 true
    archiveClassifier.set "xpl"
    manifest {
        attributes gitManifestAttrs
    }
    // files and folders with "-dev" or "--xx" in their name
    // will not be in the compiled jar
    exclude "**/resources/**/*-dev**"
    exclude "**/resources/**/*--xx**"
    from {
        configurations.implementAndInclude.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
    }
    with jar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifacts {
                artifact sourceJar
                artifact javadocJar
                artifact xnatPluginJar
            }

            pom.withXml {
                def root = asNode()
                root.appendNode("name", "XNAT Workshop 2016 Plugin")
                root.appendNode("url", "https://bitbucket.org/xnatx/xnatx-nihss-plugin")
                root.appendNode("inceptionYear", "2016")

                def scm = root.appendNode("scm")
                scm.appendNode("url", "https://bitbucket.org/xnatx/xnatx-nihss-plugin")
                scm.appendNode("connection", "scm:https://bitbucket.org/xnatx/xnatx-nihss-plugin")
                scm.appendNode("developerConnection", "scm:git@bitbucket.org:xnatx/xnatx-nihss-plugin.git")

                def license = root.appendNode("licenses").appendNode("license")
                license.appendNode("name", "Simplified BSD 2-Clause License")
                license.appendNode("url", "http://xnat.org/about/license.php")
                license.appendNode("distribution", "repo")

                root.appendNode("developers").with {
                    def rherrick = appendNode("developer")
                    rherrick.appendNode("id", "rherrick")
                    rherrick.appendNode("name", "Rick Herrick")
                    rherrick.appendNode("email", "jrherrick@wustl.edu")
                }
            }
        }
    }

    repositories {
        maven {
            name = "XNAT_Artifactory"
            url = project.version.toString().endsWith("-SNAPSHOT")
                ? "https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot-local"
                : "https://nrgxnat.jfrog.io/nrgxnat/libs-release-local"
            // CI injects ORG_GRADLE_PROJECT_artifactoryUser/Token env vars (Gradle maps
            // these to project properties). Local devs can set artifactoryUser/Token in
            // ~/.gradle/gradle.properties. Mirrors monorepo's buildSrc convention.
            credentials {
                username = (project.findProperty("artifactoryUser")  ?: System.getenv("ARTIFACTORY_USER"))  ?: ""
                password = (project.findProperty("artifactoryToken") ?: System.getenv("ARTIFACTORY_TOKEN")) ?: ""
            }
        }
    }
}

def propertyWithDefault(String name, Object value) {
    hasProperty(name) ? property(name) : value
}
